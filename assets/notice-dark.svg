<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="My old account @idrees538 was suspended, so this is my main GitHub now. Links to github.com/idrees538 no longer work.">
<title>My old account @idrees538 was suspended, so this is my main GitHub now. Links to github.com/idrees538 no longer work.</title>
<style>
  .sans{font-family:'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif} .mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
  @keyframes pulse{0%{r:4;opacity:.8}70%{r:11;opacity:0}100%{r:11;opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .pulse{animation:pulse 2s ease-out infinite}
  .spin{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
  .spin-r{animation:spin 60s linear infinite reverse;transform-box:fill-box;transform-origin:center}
  .fadein{animation:fadein .6s ease-out both}
  @media (prefers-reduced-motion:reduce){.pulse,.spin,.spin-r,.fadein{animation:none}}
</style>
<rect x="0.5" y="0.5" width="1199" height="63" rx="12" fill="#161d2d" stroke="rgba(148,163,184,0.26)" stroke-dasharray="5 5"/>
<circle cx="40" cy="32" r="11" fill="none" stroke="#ffc857" stroke-width="1.8"/>
<path d="M40 26v7M40 37.5v.5" stroke="#ffc857" stroke-width="2" stroke-linecap="round"/>
<text x="64" y="37.5" class="sans" font-size="16" fill="#e6e9f2">My old account @idrees538 was suspended, so this is my main GitHub now. <tspan class="mono" font-size="13" fill="#94a0b8">Links to github.com/idrees538 no longer work.</tspan></text>
</svg>