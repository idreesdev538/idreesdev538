name: Redraw profile

on:
  schedule:
    - cron: "17 0 * * *" # every night, 00:17 UTC (05:17 in Islamabad)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["profile.config.json", "scripts/**"]

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Draw SVGs and README
        env:
          # Optional: a personal token (read:user scope) saved as the PROFILE_TOKEN secret
          # makes private contributions count. Without it the public calendar is used.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: node scripts/build.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md data
          git diff --cached --quiet || git commit -m "Redraw profile $(date -u +%F)"
          git push
