<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Muhammad Idrees Younas, Lead Full Stack Developer at DevEntia Tech. I build web and mobile apps with React, Next.js, Node.js and React Native.">
<title>Muhammad Idrees Younas, Lead Full Stack Developer at DevEntia Tech. I build web and mobile apps with React, Next.js, Node.js and React Native.</title>
<style>
  .sans{font-family:'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif} .mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
  @keyframes pulse{0%{r:4;opacity:.8}70%{r:11;opacity:0}100%{r:11;opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .pulse{animation:pulse 2s ease-out infinite}
  .spin{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
  .spin-r{animation:spin 60s linear infinite reverse;transform-box:fill-box;transform-origin:center}
  .fadein{animation:fadein .6s ease-out both}
  @media (prefers-reduced-motion:reduce){.pulse,.spin,.spin-r,.fadein{animation:none}}
</style>
<defs><clipPath id="c"><rect width="1200" height="340" rx="16"/></clipPath></defs>
<rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="#fffdf9" stroke="rgba(30,30,50,0.10)"/>
<g clip-path="url(#c)">
  <rect x="0" y="0" width="6" height="340" fill="#e8622f"/>
  
<g opacity="0.95">
  <circle cx="1000" cy="150" r="118" fill="none" stroke="rgba(30,30,50,0.20)" stroke-dasharray="2 7"/>
  <circle cx="1000" cy="150" r="76" fill="none" stroke="rgba(30,30,50,0.20)"/>
  <g class="spin"><circle cx="1000" cy="150" r="118" fill="none" stroke="none"/><circle cx="1118" cy="150" r="7" fill="#e8622f"/><circle cx="917" cy="233" r="5" fill="#b7791f"/></g>
  <g class="spin-r"><circle cx="1000" cy="150" r="76" fill="none" stroke="none"/><circle cx="1000" cy="74" r="5" fill="#0f8a7e"/></g>
  <rect x="962" y="112" width="76" height="76" rx="20" fill="#f6f1ea" stroke="rgba(30,30,50,0.20)"/>
  <text x="1000" y="160" text-anchor="middle" class="mono" font-size="28" font-weight="700" fill="#c2410c">&lt;/&gt;</text>
</g>
</g>
<g class="fadein">
  <text x="56" y="74" class="mono" font-size="14" fill="#c2410c">// hi, I'm</text>
  <text x="54" y="128" class="sans" font-size="50" font-weight="800" letter-spacing="-1.5" fill="#1c1d2b">Muhammad Idrees Younas</text>
  <text x="56" y="172" class="sans" font-size="22" font-weight="600" fill="#1c1d2b">Lead Full Stack Developer <tspan fill="#555a6e" font-weight="400">at</tspan> <tspan fill="#c2410c">DevEntia Tech</tspan></text>
  <text x="56" y="208" class="sans" font-size="18" fill="#555a6e">I build web and mobile apps with React, Next.js, Node.js and React Native.</text>

  <rect x="56" y="236" width="201" height="30" rx="8" fill="#f6f1ea" stroke="rgba(30,30,50,0.20)"/>
  <circle cx="74" cy="251" r="4" fill="#0f8a7e" class="pulse"/>
  <circle cx="74" cy="251" r="4" fill="#0f8a7e"/>
  <text x="88" y="255.5" class="mono" font-size="12.5" fill="#1c1d2b">Open to remote roles</text>
</g>
<line x1="56" y1="290" x2="1144" y2="290" stroke="rgba(30,30,50,0.10)"/>
<g class="mono" font-size="12.5" fill="#8b8fa0">
  <text x="56" y="318">Islamabad, Pakistan</text>
