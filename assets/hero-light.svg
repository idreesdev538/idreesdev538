<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Muhammad Idrees Younas: Full stack engineer building products that ship.">
<title>Muhammad Idrees Younas: Full stack engineer building products that ship.</title>
<style>
  .sans{font-family:Geist, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif} .mono{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace} .serif{font-family:'Instrument Serif', Georgia, 'Times New Roman', serif;font-style:italic}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes pulse{0%{r:4;opacity:.9}70%{r:11;opacity:0}100%{r:11;opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,18px)}}
  .blink{animation:blink 1.1s steps(1) infinite}
  .pulse{animation:pulse 2s ease-out infinite}
  .rise{animation:rise .7s cubic-bezier(.22,1,.36,1) both}
  .drift{animation:drift 14s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.blink,.pulse,.rise,.drift{animation:none}}
</style>

<defs>
  <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5b3fd9" stop-opacity="0.35"/><stop offset="1" stop-color="#5b3fd9" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#c6ff3d" stop-opacity="0.27999999999999997"/><stop offset="1" stop-color="#c6ff3d" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(10,10,20,0.09)" stroke-width="1"/></pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0.35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
  <mask id="gm"><rect width="1200" height="400" fill="url(#fade)"/></mask>
  <clipPath id="clip"><rect width="1200" height="400" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect x="0.5" y="0.5" width="1199" height="399" rx="22" fill="#ffffff" stroke="rgba(10,10,20,0.09)"/>
  <rect width="1200" height="400" fill="url(#grid)" mask="url(#gm)"/>
  <g class="drift"><circle cx="1010" cy="70" r="300" fill="url(#g1)"/></g>
  <circle cx="1120" cy="380" r="220" fill="url(#g2)"/>
</g>

<g class="rise">
  <rect x="56" y="48" width="382" height="30" rx="15" fill="#f0f0ea" stroke="rgba(10,10,20,0.18)"/>
  <circle cx="76" cy="63" r="4" fill="#c6ff3d" class="pulse" opacity="0.8"/>
  <circle cx="76" cy="63" r="4" fill="#3f6400"/>
  <text x="90" y="67.5" class="mono" font-size="13" fill="#111015">Open to remote roles and founder projects</text>
</g>

<g class="rise" style="animation-delay:.08s">
  <text x="54" y="152" class="sans" font-size="58" font-weight="600" letter-spacing="-2" fill="#111015">Full stack engineer</text>
  <text x="54" y="216" class="sans" font-size="58" font-weight="600" letter-spacing="-2" fill="#111015">building products <tspan class="serif" font-weight="400" letter-spacing="-1" fill="#3f6400">that ship.</tspan><tspan class="blink" font-weight="300" fill="#3f6400" dx="6">|</tspan></text>
</g>

<g class="rise" style="animation-delay:.16s">
  <text x="56" y="272" class="sans" font-size="20" fill="#55535f">I'm <tspan fill="#111015" font-weight="600">Muhammad Idrees Younas</tspan>, lead full stack developer at DevEntia Tech.</text>
  <text x="56" y="302" class="sans" font-size="20" fill="#55535f">Web and mobile products for founders, from first release to production.</text>
</g>

<line x1="56" y1="336" x2="1144" y2="336" stroke="rgba(10,10,20,0.09)"/>
<g class="mono" font-size="12" letter-spacing="1.4" fill="#8a8895">
  <text x="56" y="365">ISLAMABAD, PAKISTAN</text>
  <text x="600" y="365" text-anchor="middle">4+ YEARS · 10+ PRODUCTS SHIPPED</text>
  <text x="1144" y="365" text-anchor="end">GITHUB.COM/IDREESDEV538</text>
</g>
</svg>