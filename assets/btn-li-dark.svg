<svg xmlns="http://www.w3.org/2000/svg" width="135" height="42" viewBox="0 0 135 42" role="img" aria-label="LinkedIn">
<title>LinkedIn</title>
<style>
  .sans{font-family:'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif} .mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
  @keyframes pulse{0%{r:4;opacity:.8}70%{r:11;opacity:0}100%{r:11;opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .pulse{animation:pulse 2s ease-out infinite}
  .spin{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
  .spin-r{animation:spin 60s linear infinite reverse;transform-box:fill-box;transform-origin:center}
  .fadein{animation:fadein .6s ease-out both}
  @media (prefers-reduced-motion:reduce){.pulse,.spin,.spin-r,.fadein{animation:none}}
</style>
<rect x="0.5" y="0.5" width="134" height="41" rx="10" fill="#0f1420" stroke="rgba(148,163,184,0.26)"/>
<g transform="translate(24 21)" style="color:#e6e9f2"><rect x="-7" y="-7" width="14" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M-3.5 -1V4M-3.5 -3.6v.1M0 4V-1M0 1.2c0-1.6 3.6-2.6 3.6 0V4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></g>
<text x="42" y="26" class="mono" font-size="14" font-weight="600" fill="#e6e9f2">LinkedIn</text>
</svg>