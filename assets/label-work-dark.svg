<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="56" viewBox="0 0 1200 56" role="img" aria-label="Things I've built &amp; led">
<title>Things I've built &amp; led</title>
<style>
  .sans{font-family:Geist, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif} .mono{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace} .serif{font-family:'Instrument Serif', Georgia, 'Times New Roman', serif;font-style:italic}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes pulse{0%{r:4;opacity:.9}70%{r:11;opacity:0}100%{r:11;opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,18px)}}
  .blink{animation:blink 1.1s steps(1) infinite}
  .pulse{animation:pulse 2s ease-out infinite}
  .rise{animation:rise .7s cubic-bezier(.22,1,.36,1) both}
  .drift{animation:drift 14s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.blink,.pulse,.rise,.drift{animation:none}}
</style>
<text x="4" y="38" class="sans" font-size="26" font-weight="600" letter-spacing="-0.6" fill="#eeecf3">Things I've <tspan class="serif" font-weight="400" fill="#c6ff3d">built &amp; led</tspan></text>
<line x1="317" y1="30" x2="1196" y2="30" stroke="rgba(255,255,255,0.16)"/>
</svg>