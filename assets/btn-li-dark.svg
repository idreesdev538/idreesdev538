<svg xmlns="http://www.w3.org/2000/svg" width="134" height="44" viewBox="0 0 134 44" role="img" aria-label="LinkedIn">
<title>LinkedIn</title>
<style>
  .sans{font-family:Geist, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif} .mono{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace} .serif{font-family:'Instrument Serif', Georgia, 'Times New Roman', serif;font-style:italic}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes pulse{0%{r:4;opacity:.9}70%{r:11;opacity:0}100%{r:11;opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,18px)}}
  .blink{animation:blink 1.1s steps(1) infinite}
  .pulse{animation:pulse 2s ease-out infinite}
  .rise{animation:rise .7s cubic-bezier(.22,1,.36,1) both}
  .drift{animation:drift 14s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.blink,.pulse,.rise,.drift{animation:none}}
</style>
<rect x="0.5" y="0.5" width="133" height="43" rx="22" fill="#0e0e13" stroke="rgba(255,255,255,0.16)"/>
<g transform="translate(26 22)" style="color:#eeecf3"><rect x="-7" y="-7" width="14" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M-3.5 -1V4M-3.5 -3.6v.1M0 4V-1M0 1.2c0-1.6 3.6-2.6 3.6 0V4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></g>
<text x="44" y="26.5" class="mono" font-size="13" letter-spacing="1.2" fill="#eeecf3">LINKEDIN</text>
</svg>